# Standalone alternative for Home Assistant Container installations.
# Start with: docker compose up --build -d
services:
  intiha-engine:
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "12345:12345"
      - "12346:12346"
    environment:
      INTIHA_LOG_LEVEL: info
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 20s
