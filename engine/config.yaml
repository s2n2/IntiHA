name: IntiHA Proxy Engine
version: "0.3.0b10"
slug: intiha_engine
description: Buttplug server using Home Assistant managed Bluetooth and ESPHome proxies; no local Bluetooth adapter required
url: https://github.com/s2n2/IntiHA
image: ghcr.io/s2n2/intiha-engine
timeout: 30
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
homeassistant: "2026.10.0"
discovery:
  - intiha
ports:
  12345/tcp: 12345
  12346/tcp: 12346
ports_description:
  12345/tcp: Buttplug clients
  12346/tcp: IntiHA Home Assistant bridge
watchdog: http://[HOST]:[PORT:12345]/health
options:
  log_level: info
schema:
  log_level: list(error|warn|info|debug)
