stop_all:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: intiha
scan:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: intiha
reconnect:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: intiha
capture_status:
  fields:
    address:
      required: true
      selector:
        text:
    seconds:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
