stop_all:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: intiha
scan:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: intiha
reconnect:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: intiha
capture_status:
  fields:
    address:
      required: true
      selector:
        text:
    seconds:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s

handy:
  fields:
    address:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options: [status, hamp_start, hamp_velocity, hamp_zone, hamp_stop, hdsp]
    velocity:
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
    lo:
      selector:
        number:
          min: 0
          max: 100
    hi:
      selector:
        number:
          min: 0
          max: 100
    wait:
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
